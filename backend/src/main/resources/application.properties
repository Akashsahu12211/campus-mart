server.address=0.0.0.0
server.port=${PORT:8081}

app.environment=${APP_ENV:production}
app.expose-dev-otp=${APP_EXPOSE_DEV_OTP:false}
app.enforce-contact-access-gating=${APP_ENFORCE_CONTACT_ACCESS_GATING:true}
app.allow-test-plan-activation=${APP_ALLOW_TEST_PLAN_ACTIVATION:false}
app.detailed-errors=${APP_DETAILED_ERRORS:false}
app.require-secure-transport=${APP_REQUIRE_SECURE_TRANSPORT:true}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_mart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway Configuration for Database Migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

spring.application.name=campus-mart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.uploads.base-dir=${APP_UPLOADS_BASE_DIR:uploads}
app.uploads.public-base-url=${APP_UPLOADS_PUBLIC_BASE_URL:}
app.item-images.max-size-bytes=${APP_ITEM_IMAGES_MAX_SIZE_BYTES:6291456}
app.item-images.max-count=${APP_ITEM_IMAGES_MAX_COUNT:20}
app.storage.mode=${APP_STORAGE_MODE:local}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:ap-south-1}
app.storage.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:}
app.storage.s3.access-key=${APP_STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${APP_STORAGE_S3_SECRET_KEY:}
app.storage.s3.public-base-url=${APP_STORAGE_S3_PUBLIC_BASE_URL:}
app.storage.s3.key-prefix=${APP_STORAGE_S3_KEY_PREFIX:campus-mart}
app.storage.s3.path-style=${APP_STORAGE_S3_PATH_STYLE:false}

# Gmail SMTP config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:true}
notifications.push.enabled=${NOTIFICATIONS_PUSH_ENABLED:true}
notifications.from-email=${NOTIFICATIONS_FROM_EMAIL:noreply@campusmart.com}
notifications.new-item.email-broadcast.enabled=${NOTIFICATIONS_NEW_ITEM_EMAIL_BROADCAST_ENABLED:false}
notifications.new-item.batch-size=${NOTIFICATIONS_NEW_ITEM_BATCH_SIZE:200}
notifications.new-item.max-recipients=${NOTIFICATIONS_NEW_ITEM_MAX_RECIPIENTS:2000}
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.service-account.base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}
firebase.service-account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiry.ms=${JWT_EXPIRY_MS:900000}
jwt.refresh.expiry.ms=${JWT_REFRESH_EXPIRY_MS:2592000000}

# Twilio SMS Configuration
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# OTP settings
otp.expiry.minutes=10
otp.max.attempts=3
otp.resend.limit=3
otp.resend.window.minutes=30

# Logging Configuration
logging.level.root=INFO
logging.level.com.campusmart=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/campus-mart.log

# ── RAZORPAY Payment Gateway Configuration ───────────────────────
# 🔑 Get test keys from: https://dashboard.razorpay.com/settings/api-keys
# 📝 In production: replace test keys with live keys (rzp_live_XXXX)
# razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxx}
#razorpay.key.secret=${RAZORPAY_KEY_SECRET:WJ1D68TJL2IseUcQjZTIFXnt}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Escrow: Auto-release payment after N hours if not confirmed
razorpay.escrow.auto.release.hours=48

# Platform fee percentage (0 for now, can be used later)
razorpay.platform.fee.percent=0

# WebSocket CORS Configuration
app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS:}
app.websocket.broker-relay-host=${APP_WEBSOCKET_BROKER_RELAY_HOST:}
app.websocket.broker-relay-port=${APP_WEBSOCKET_BROKER_RELAY_PORT:61613}
app.websocket.broker-relay-login=${APP_WEBSOCKET_BROKER_RELAY_LOGIN:}
app.websocket.broker-relay-passcode=${APP_WEBSOCKET_BROKER_RELAY_PASSCODE:}
app.websocket.broker-relay-virtual-host=${APP_WEBSOCKET_BROKER_RELAY_VHOST:}
app.maintenance.migrate-inline-item-images-on-startup=${APP_MAINTENANCE_MIGRATE_INLINE_ITEM_IMAGES_ON_STARTUP:false}
app.maintenance.inline-image-migration-limit=${APP_MAINTENANCE_INLINE_IMAGE_MIGRATION_LIMIT:0}
